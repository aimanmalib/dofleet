name: release

# Publishes to PyPI with Trusted Publishing (OIDC, no API token) only when a
# GitHub Release is published. Configure the "pypi" environment and the
# trusted publisher on PyPI before the first release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: false # never restore a cache into a publishing job
      # Same build as the CI base-install job (sdist, then the wheel from the sdist).
      - run: uv build
      # README renders on PyPI and the metadata is well-formed.
      - run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dofleet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Official MCP Registry (io.github.aimanmalib/dofleet). Order per the registry docs: the PyPI release must exist first; the
  # registry checks the "mcp-name:" marker in the PyPI description. GitHub OIDC login: no secret needed.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install mcp-publisher (signature verified)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -sSfL -o mcp.tgz "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -sSfL -o mcp.tgz.sigstore.json "$base/mcp-publisher_linux_amd64.tar.gz.sigstore.json"
          cosign verify-blob --bundle mcp.tgz.sigstore.json \
            --certificate-identity-regexp '^https://github.com/modelcontextprotocol/registry/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com mcp.tgz
          tar xzf mcp.tgz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - name: Publish (retries while PyPI catches up with the new version)
        run: |
          for _ in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1
