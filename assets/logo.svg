<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="dofleet">
  <title>dofleet</title>
  <!-- droplet -->
  <path d="M48 5C48 5 16 41 16 62a32 32 0 0 0 64 0C80 41 48 5 48 5Z" fill="#0E2A3D"/>
  <!-- expiry timer: track, remaining time, hand -->
  <circle cx="48" cy="62" r="18" fill="none" stroke="#1F4A66" stroke-width="6"/>
  <circle cx="48" cy="62" r="18" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="84.8 113.1" transform="rotate(-90 48 62)"/>
  <path d="M48 62V51" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>
  <circle cx="48" cy="62" r="3.2" fill="#F8FAFC"/>
  <!-- the last quarter is gone: a small spark where the arc ends -->
  <circle cx="30" cy="62" r="3" fill="#FBBF24"/>
</svg>
