[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dofleet"
version = "0.1.0"
description = "Disposable DigitalOcean droplets with a cost guard: presets, sold-out fallback, expiry timers and an auto-reaper."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aiman Malib" }]
keywords = ["digitalocean", "droplet", "cli", "cloud", "cost"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dofleet = "dofleet.cli:main"

[project.urls]
Source = "https://github.com/aimanmalib/dofleet"

[tool.hatch.build.targets.wheel]
packages = ["src/dofleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
